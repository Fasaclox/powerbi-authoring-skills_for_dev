<!doctype html><meta charset='utf-8'><title>Theme presets</title><style>body{margin:0;padding:24px;background:#fff;font-family:Inter,sans-serif;color:#222}h1{font-size:20px;margin:0 0 16px}main{display:grid;grid-template-columns:repeat(3,640px);gap:20px}figure{margin:0}img{display:block;width:640px;height:412px}figcaption{font-size:12px;line-height:1.4;margin-top:6px;color:#444;max-width:640px}</style><h1>Power BI theme presets (9)</h1><main><figure><img src="previews/lavender-soft.svg" alt="lavender-soft"><figcaption><b>lavender-soft</b> · Deep purple with lavender tiles on a white canvas; rounded, borderless, airy. HR and people dashboards.</figcaption></figure><figure><img src="previews/ocean-calm.svg" alt="ocean-calm"><figcaption><b>ocean-calm</b> · Confident blue on pale blue tiles; the safe default for finance, sales and ops reports.</figcaption></figure><figure><img src="previews/mint-fresh.svg" alt="mint-fresh"><figcaption><b>mint-fresh</b> · Teal and mint with soft green tiles; health, sustainability, operations.</figcaption></figure><figure><img src="previews/sunset-warm.svg" alt="sunset-warm"><figcaption><b>sunset-warm</b> · Coral and amber on a warm off-white canvas with lifted white cards; retail, hospitality, marketing.</figcaption></figure><figure><img src="previews/slate-corporate.svg" alt="slate-corporate"><figcaption><b>slate-corporate</b> · Navy and steel on a grey canvas with crisp outlined white cards; board and finance packs.</figcaption></figure><figure><img src="previews/midnight-dark.svg" alt="midnight-dark"><figcaption><b>midnight-dark</b> · Dark navy canvas, violet and cyan series, soft raised tiles; wallboards and night-mode reports.</figcaption></figure><figure><img src="previews/rose-soft.svg" alt="rose-soft"><figcaption><b>rose-soft</b> · Raspberry and blush tiles on white; beauty, wellness, community and customer reports.</figcaption></figure><figure><img src="previews/mono-minimal.svg" alt="mono-minimal"><figcaption><b>mono-minimal</b> · Swiss-style black, greys and one blue accent; square corners, no chrome, maximum data-ink.</figcaption></figure><figure><img src="previews/sand-editorial.svg" alt="sand-editorial"><figcaption><b>sand-editorial</b> · Serif headings, warm sand canvas, ink and terracotta series; narrative and board-story pages.</figcaption></figure></main>
